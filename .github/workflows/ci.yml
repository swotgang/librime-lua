name: Build librime with librime-lua
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout librime-lua
        uses: actions/checkout@v4
        with:
          path: lua_src

      - name: Checkout librime source
        run: |
          git clone https://github.com/rime/librime.git
          cd librime
          git checkout 1.13.1
          cd ..
          if (!(Test-Path "librime/plugins")) { New-Item -ItemType Directory -Path "librime/plugins" }
          xcopy /e /y lua_src librime\plugins\librime-lua\

      - name: Setup vcpkg
        uses: microsoft/vcpkg-tool/main@v1

      - name: Install librime required dependencies
        run: |
          vcpkg install boost:x64-windows glog:x64-windows gflags:x64-windows yaml-cpp:x64-windows leveldb:x64-windows

      - name: Cmake Build
        run: |
          cd librime
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DBUILD_SHARED_LIBS=ON
          ninja

      - name: Upload compiled dll artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librime1.13.1-lua-win64
          path: |
            librime/build/bin/librime.dll
            librime/build/bin/librime-lua.dll
