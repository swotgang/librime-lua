name: Build librime with librime-lua
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout librime-lua
        uses: actions/checkout@v4
        # 检出到单独文件夹，避免路径嵌套循环
        with:
          path: lua_src

      - name: Download librime 1.13.1 source
        run: |
          git clone https://github.com/rime/librime.git
          cd librime
          git checkout 1.13.1
          cd ..
          # 创建plugins目录
          if (!(Test-Path "librime/plugins")) { New-Item -ItemType Directory -Path "librime/plugins" }
          # 把lua_src里的源码复制到插件目录，不再是.当前目录，解决循环拷贝
          xcopy /e /y lua_src librime\plugins\librime-lua\

      - name: Install build tools
        run: |
          choco install ninja cmake

      - name: Cmake Build
        run: |
          cd librime
          mkdir build
          cd build
          cmake .. -G Ninja -DBUILD_SHARED_LIBS=ON
          ninja

      - name: Upload compiled dll artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librime1.13.1-lua-win64
          path: |
            librime/build/bin/librime.dll
            librime/build/bin/librime-lua.dll
